name: sfera-integration-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sfera_test
      POSTGRES_USER: sfera_test
      POSTGRES_PASSWORD: sfera_test_only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfera_test -d sfera_test"]
      interval: 2s
      timeout: 3s
      retries: 30
